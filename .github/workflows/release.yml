name: Build and Release

# Releases are cut manually, but the binaries must never be missing.
#
#   release:published  - you click "Publish release" in the GitHub UI and the
#                        binaries get built and attached to it. This is the
#                        path that used to silently produce an empty release.
#   push (tag)         - a tag you push yourself from a local clone.
#                        NOTE: tags pushed by a workflow using GITHUB_TOKEN do
#                        NOT trigger this, which is why the auto-bumped
#                        v0.1.x tags never produced builds.
#   workflow_dispatch  - build and release an existing tag on demand.
on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing tag to build and release (e.g. v2.0.0)'
        required: true
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve tag to build
        id: resolve
        run: |
          case "${{ github.event_name }}" in
            release)           TAG="${{ github.event.release.tag_name }}" ;;
            workflow_dispatch) TAG="${{ github.event.inputs.version }}" ;;
            *)                 TAG="${GITHUB_REF#refs/tags/}" ;;
          esac

          if [ -z "$TAG" ]; then
            echo "::error::Could not determine which tag to build."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building tag: $TAG"

  build:
    needs: setup
    strategy:
      # Build both platforms even if one fails, so the logs show whether the
      # problem is platform-specific.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            built_name: QuinLangIDE.exe
            asset_name: QuinLangIDE-windows-x64.exe
          - os: ubuntu-latest
            built_name: QuinLangIDE
            asset_name: QuinLangIDE-linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller quinlang_ide.spec --clean

      # The in-app updater picks its download by looking for "windows"/"linux"
      # in the asset name. The bare PyInstaller output names matched neither,
      # so every update check found no downloadable asset and gave up.
      - name: Rename to platform-specific asset name
        shell: bash
        run: mv "dist/${{ matrix.built_name }}" "dist/${{ matrix.asset_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error

  release:
    needs: [setup, build]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      # Hard gate: refuse to publish a release that is missing either binary.
      - name: Verify both binaries are present
        run: |
          ls -la ./artifacts
          MISSING=0
          for f in QuinLangIDE-windows-x64.exe QuinLangIDE-linux-x64; do
            if [ ! -s "./artifacts/$f" ]; then
              echo "::error::Missing or empty build artifact: $f"
              MISSING=1
            fi
          done
          [ "$MISSING" -eq 0 ] || exit 1
          chmod +x ./artifacts/QuinLangIDE-linux-x64

      - name: Attach binaries to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.tag }}
          name: QuinLang IDE ${{ needs.setup.outputs.tag }}
          draft: false
          prerelease: false
          # Keep any notes written in the UI; only add files.
          append_body: true
          files: |
            ./artifacts/QuinLangIDE-windows-x64.exe
            ./artifacts/QuinLangIDE-linux-x64
          body: |
            ### Downloads
            - **Windows**: `QuinLangIDE-windows-x64.exe` - Double-click to run
            - **Linux**: `QuinLangIDE-linux-x64` - Run `chmod +x QuinLangIDE-linux-x64 && ./QuinLangIDE-linux-x64`

            ### Requirements
            - No installation required - standalone executable
            - Linux users may need to install `tk`: `sudo apt install python3-tk`

      # Confirm against the API that the assets really landed on the release,
      # so a silent upload failure can't leave an empty release behind.
      - name: Confirm assets published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job never checks out the repo, so gh has no git remote to infer
          # the repository from and would fail with "not a git repository".
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ needs.setup.outputs.tag }}"

          # Asset listing can lag a moment behind the upload, so retry briefly
          # rather than failing a release that is actually fine.
          for attempt in 1 2 3 4 5; do
            ASSETS=$(gh release view "$TAG" --json assets -q '.assets[].name' || echo "")
            echo "Attempt $attempt - assets on $TAG:"
            echo "$ASSETS"

            MISSING=0
            for f in QuinLangIDE-windows-x64.exe QuinLangIDE-linux-x64; do
              echo "$ASSETS" | grep -qx "$f" || MISSING=1
            done

            if [ "$MISSING" -eq 0 ]; then
              echo "Both binaries confirmed on $TAG."
              exit 0
            fi

            sleep 5
          done

          echo "::error::Release $TAG is missing one or both binaries."
          exit 1
