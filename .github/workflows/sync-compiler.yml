name: Sync Compiler from QuinLang

# Pulls the latest compiler/runtime/examples from the QuinLang repo, bumps the
# patch version, and tags it.
#
# It deliberately does NOT create a GitHub release. Releases are cut by hand,
# from the Releases page, whenever a version is worth shipping - publishing one
# fires .github/workflows/release.yml, which builds and attaches both binaries.
on:
  repository_dispatch:
    types: [compiler-updated]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout QuinLang-Text-Editor
        uses: actions/checkout@v4
        with:
          path: ide

      - name: Checkout QuinLang
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/QuinLang
          path: lang

      - name: Sync compiler and runtime
        run: |
          # Remove old directories
          rm -rf ide/compiler ide/runtime ide/examples

          # Copy fresh from QuinLang
          cp -r lang/compiler ide/compiler
          cp -r lang/runtime ide/runtime
          cp -r lang/examples ide/examples

          # Remove any __pycache__ directories
          find ide/compiler ide/runtime -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true

      - name: Check for changes
        id: changes
        run: |
          cd ide
          if [[ -n $(git status --porcelain) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          cd ide
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add compiler/ runtime/ examples/
          git commit -m "Sync compiler/runtime from QuinLang

          Source commit: ${{ github.event.client_payload.sha || 'manual sync' }}"

          git push

      - name: Compute next version
        if: steps.changes.outputs.has_changes == 'true'
        id: version
        run: |
          cd ide
          VERSION=$(grep -oP 'CURRENT_VERSION\s*=\s*"\K[^"]+' ide/updater.py || echo "")

          if [ -z "$VERSION" ]; then
            echo "::error::Could not read CURRENT_VERSION from ide/updater.py"
            exit 1
          fi

          # Default the minor/patch fields so a two-part version like "1.06"
          # can't produce a malformed bump (the old logic emitted "1.06.1").
          IFS='.' read -r major minor patch <<< "$VERSION"
          major=${major:-0}
          minor=${minor:-0}
          patch=${patch:-0}

          if ! [[ "$major$minor$patch" =~ ^[0-9]+$ ]]; then
            echo "::error::CURRENT_VERSION '$VERSION' is not numeric dotted form"
            exit 1
          fi

          NEW_VERSION="${major}.${minor}.$((patch + 1))"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Bumping $VERSION -> $NEW_VERSION"

      - name: Bump version and tag
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          cd ide
          NEW_VERSION="${{ steps.version.outputs.version }}"

          sed -i "s/CURRENT_VERSION = \"[^\"]*\"/CURRENT_VERSION = \"${NEW_VERSION}\"/" ide/updater.py
          git add ide/updater.py
          git commit -m "Bump version to ${NEW_VERSION}"
          git push

          git tag "v${NEW_VERSION}"
          git push origin "v${NEW_VERSION}"

      - name: Summary
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          NEW_VERSION="${{ steps.version.outputs.version }}"
          {
            echo "### Compiler synced - tagged \`v${NEW_VERSION}\`"
            echo ""
            echo "No release was created. To ship this version:"
            echo ""
            echo "1. Go to **Releases > Draft a new release**"
            echo "2. Choose the existing tag \`v${NEW_VERSION}\`"
            echo "3. **Publish release**"
            echo ""
            echo "Publishing triggers \`Build and Release\`, which builds and attaches"
            echo "\`QuinLangIDE-windows-x64.exe\` and \`QuinLangIDE-linux-x64\`,"
            echo "and fails loudly if either is missing."
          } >> "$GITHUB_STEP_SUMMARY"
